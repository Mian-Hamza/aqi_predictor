name: Daily Training Pipeline

on:
  schedule:
    # Runs once a day at 02:00 UTC. 
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Lets you trigger it manually from the Actions tab, for testing

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          CITY_NAME: ${{ secrets.CITY_NAME }}
        run: |
          python training_pipeline/training_pipeline.py